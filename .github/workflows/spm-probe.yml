name: SPM local XCFramework probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; promote-ci.yml pin
        with:
          persist-credentials: false
      - name: Build unsigned fixture and consume local binary target
        shell: bash
        run: bash scripts/run-probe.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1; reviewed production pin
        with:
          name: probe-fixture
          path: |
            scripts/work/ProbeBinary.xcframework.zip
            scripts/work/ProbeBinary.sha256
            scripts/work/ProbePackage/Package.swift
          if-no-files-found: error
          retention-days: 7
