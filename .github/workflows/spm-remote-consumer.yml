name: SPM anonymous remote consumer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consume:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; reviewed pin
        with:
          persist-credentials: false
      - name: Consume public remote binary package anonymously
        shell: bash
        run: bash scripts/probes/spm-remote-consumer.sh
